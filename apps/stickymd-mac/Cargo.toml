[package]
name = "stickymd-mac"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "StickyMD macOS executable: Interaction Shell + macOS platform adapters"

[dependencies]
stickymd-core = { path = "../../crates/stickymd-core" }
stickymd-render = { path = "../../crates/stickymd-render" }
stickymd-app = { path = "../../crates/stickymd-app" }
thiserror.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
stickymd-posix = { path = "../../crates/stickymd-posix" }
stickymd-desktop = { path = "../../crates/stickymd-desktop" }
winit.workspace = true
raw-window-handle.workspace = true
notify = { workspace = true, features = ["macos_fsevent"] }
tray-icon.workspace = true
crossbeam-channel.workspace = true
libc = "0.2.172"
tiny-skia.workspace = true
block2 = "0.6.1"
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
unicode-normalization = "0.1.25"

[target.'cfg(target_os = "macos")'.dev-dependencies]
stickymd-desktop = { path = "../../crates/stickymd-desktop", features = ["testing"] }
image.workspace = true
