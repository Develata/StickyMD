[package]
name = "stickymd-win"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "StickyMD Windows executable: Interaction Shell + Windows platform adapters"

[package.metadata.winresource]
ProductName = "StickyMD"
FileDescription = "StickyMD portable Markdown scratchpad"
OriginalFilename = "StickyMD.exe"
LegalCopyright = "Copyright (c) 2026 Develata"

[dependencies]
stickymd-core = { path = "../../crates/stickymd-core" }
stickymd-render = { path = "../../crates/stickymd-render" }
stickymd-app = { path = "../../crates/stickymd-app" }
thiserror.workspace = true
sha2.workspace = true

[dev-dependencies]
cosmic-text.workspace = true

[target.'cfg(windows)'.dev-dependencies]
stickymd-desktop = { path = "../../crates/stickymd-desktop", features = ["testing"] }

[target.'cfg(windows)'.dependencies]
stickymd-desktop = { path = "../../crates/stickymd-desktop" }
arboard.workspace = true
raw-window-handle.workspace = true
winit.workspace = true
notify.workspace = true
tray-icon.workspace = true
crossbeam-channel.workspace = true
windows.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.31", default-features = false }
