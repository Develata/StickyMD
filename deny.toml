# Dependency policy for the Windows 11 x64 v1 graph and the Apple Silicon macOS host.

[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 is a transitive cosmic-text/fontdb dependency with no safe upgrade; tracked in docs/report/RISK-ttf-parser-unmaintained.md" },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # notify uses CC0 for its implementation; reviewed in the Phase 4 dependency delta.
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    # finl_unicode bundles Unicode data under this OSI-approved data/software license.
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Allows path dependencies without a version in crates that are not published (all workspace
# members are `publish = false` and refer to each other by path only), and in dev-dependencies of
# any crate. It does not check that the path is a workspace member; git sources stay governed by
# `unknown-git`.
allow-wildcard-paths = true
highlight = "simplest-path"
deny = [
    "async-std",
    "egui",
    "iced",
    "slint",
    "tauri",
    "tokio",
    "wgpu",
    "wry",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
