[workspace]
resolver = "2"
members = [
    "crates/stickymd-core",
    "crates/stickymd-render",
    "apps/stickymd-win",
    "tools/stickymd-smoke",
]

# 注意：experiments/phase-01/* 是独立的技术验证 crate（各自声明空 [workspace]），
# 不属于生产 workspace；删除 experiments/ 不影响本 workspace 构建。
# tools/stickymd-smoke 是 std-only 开发验证 CLI，不是产品 runtime，也不进入发布包。

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
comrak = { version = "=0.54.0", default-features = false }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2.32"
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-font = "=0.1.14"
ratex-font-loader = { version = "=0.1.14", default-features = false, features = ["embed-fonts"] }
ratex-unicode-font = "=0.1.14"
unicode-script = "0.5.8"
unicode-segmentation = "1.13.3"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4.8", default-features = false }
raw-window-handle = "0.6.2"
arboard = { version = "3.6.1", default-features = false }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
serde = { version = "1.0.219", features = ["derive"] }
toml = { version = "0.9.5", default-features = false, features = ["std", "serde", "parse", "display"] }
notify = { version = "8.2.0", default-features = false }
windows = { version = "0.62.0", default-features = false, features = [
    "std",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
