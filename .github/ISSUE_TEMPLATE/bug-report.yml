name: Bug 报告
description: 报告可复现的错误、数据可靠性问题或交互异常
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 StickyMD。请使用合成内容复现，不要上传真实 note.md、剪贴板内容、用户名、完整个人路径、恢复文件、令牌或其他敏感信息。

        安全漏洞请不要在公开 Issue 中披露，请改用 Security Advisory。

        主维护者 Develata 有时需要优先处理学业，回复可能较慢。Issue 可能由 AI 辅助分类和审计，但最终判断由维护者完成。

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: 重复检查
      options:
        - label: 我已经搜索现有 Issue，没有找到相同问题。
          required: true

  - type: dropdown
    id: issue-kind
    attributes:
      label: 问题类型
      options:
        - Bug / 行为错误
        - Regression / 之前正常、现在异常
        - 数据可靠性 / 保存、恢复或文件安全
        - 兼容性 / Windows、DPI、显示器或输入法环境
        - 性能或资源占用
        - 文档、构建、CI 或验收工具
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: 影响程度
      options:
        - 可能丢失、覆盖或泄露数据
        - 崩溃、无法启动或主要功能不可用
        - 功能明显错误，但有临时绕过方式
        - 轻微交互、视觉或文档问题
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: StickyMD 版本
      description: 例如 v0.1.0；如果是源码构建，请填写完整 commit SHA。
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: artifact-sha
    attributes:
      label: ZIP 或 StickyMD.exe SHA-256
      description: 使用发布包时建议填写，可从 SHA256SUMS.txt 或 Get-FileHash 获取。
      placeholder: 可选

  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - 源码编辑、选择或中文输入法
        - Markdown 预览或数学公式
        - 自动保存、恢复或外部修改
        - 图片粘贴、资产或导出
        - 窗口、托盘、贴边或显示器
        - 查找、替换、缩放或主题
        - 性能、内存或 CPU
        - 构建、测试或发布工具
        - 文档、贡献流程或项目页面
        - 其他
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 请填写 Windows 11 build、显示缩放、显示器数量，以及涉及输入时的输入法。
      placeholder: |
        Windows 11 build:
        DPI/缩放:
        显示器:
        输入法:
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 将 StickyMD 解压到……
        2. 输入合成测试文本……
        3. 执行……
        4. 出现……
    validations:
      required: true

  - type: textarea
    id: frequency-regression
    attributes:
      label: 频率与回归信息
      description: 说明每次都发生、偶发还是只发生一次；如果是回归，请写最后正常版本和第一个异常版本。
      placeholder: |
        发生频率:
        最后正常版本:
        第一个异常版本:
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 如果涉及数据，请说明是否发生覆盖、丢失、泄露、保存失败或不可恢复状态。
    validations:
      required: true

  - type: textarea
    id: fixture
    attributes:
      label: 合成 Markdown 或其他证据
      description: 可粘贴不含私人信息的最小 Markdown，并拖入截图或短视频。

  - type: markdown
    attributes:
      value: |
        StickyMD v0.1.0 没有原生日志文件。需要时请按[贡献指南中的诊断步骤](https://github.com/Develata/StickyMD/blob/main/CONTRIBUTING.md#collect-diagnostics)捕获有限 stderr 或 Windows 崩溃事件；没有日志也可以提交。

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息或日志
      description: 可粘贴已脱敏的界面错误提示、stderr 或 Windows Application Error；无法获得时写“未获得日志”。
      placeholder: 请粘贴已脱敏的错误提示、stderr 或 Windows Application Error 信息，或写“未获得日志”。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认本 Issue 不包含真实便签内容、私密路径、令牌或其他敏感信息。
          required: true
        - label: 我理解本 Issue 可能由自动化工具和 AI 辅助审计。
          required: true
