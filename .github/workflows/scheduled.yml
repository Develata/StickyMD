name: scheduled-maintenance

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-and-stress:
    name: Dependency drift and deterministic stress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Advisory, license, source, and ban policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.97.1"
      - name: Report dependency drift without changing Cargo.lock
        run: cargo update --dry-run
      - name: Deterministic platform-independent stress suite
        run: cargo test -p stickymd-core -p stickymd-render --locked
