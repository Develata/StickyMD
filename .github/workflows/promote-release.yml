name: promote-release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact USER-authorized operation
        required: true
        type: choice
        options:
          - tag
          - draft
          - publish
      source_sha:
        description: Full approved Source Freeze commit
        required: true
        type: string
      artifact_run_id:
        description: release workflow run containing the promoted candidate
        required: true
        type: string
      expected_zip_sha256:
        description: Promoted candidate ZIP SHA-256
        required: true
        type: string
      expected_sbom_sha256:
        description: Promoted candidate SBOM SHA-256
        required: true
        type: string
      release_tag:
        description: Approved release tag, for example v0.1.0
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  tag:
    if: inputs.operation == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          name: stickymd-windows-x64-release
          path: dist/promoted
      - name: Verify exact artifact identity
        shell: pwsh
        run: >-
          ./tools/release/verify-promoted-artifact.ps1
          -ArtifactDirectory dist/promoted
          -SourceSha '${{ inputs.source_sha }}'
          -ExpectedZipSha256 '${{ inputs.expected_zip_sha256 }}'
          -ExpectedSbomSha256 '${{ inputs.expected_sbom_sha256 }}'
          -ReleaseTag '${{ inputs.release_tag }}'
      - name: Create or verify exact source tag
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.release_tag }}'
          source='${{ inputs.source_sha }}'
          ref="tags/${tag}"
          if existing="$(gh api "repos/${GH_REPO}/git/ref/${ref}" --jq .object.sha 2>/dev/null)"; then
            [[ "$existing" == "$source" ]] || { printf 'Existing tag points to %s, expected %s\n' "$existing" "$source" >&2; exit 1; }
          else
            gh api --method POST "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${source}" >/dev/null
          fi

  draft:
    if: inputs.operation == 'draft'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          name: stickymd-windows-x64-release
          path: dist/promoted
      - name: Verify exact artifact identity
        shell: pwsh
        run: >-
          ./tools/release/verify-promoted-artifact.ps1
          -ArtifactDirectory dist/promoted
          -SourceSha '${{ inputs.source_sha }}'
          -ExpectedZipSha256 '${{ inputs.expected_zip_sha256 }}'
          -ExpectedSbomSha256 '${{ inputs.expected_sbom_sha256 }}'
          -ReleaseTag '${{ inputs.release_tag }}'
      - name: Verify tag identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/${GH_REPO}/git/ref/tags/${{ inputs.release_tag }}" --jq .object.sha)"
          [[ "$actual" == '${{ inputs.source_sha }}' ]] || { printf 'Tag points to %s\n' "$actual" >&2; exit 1; }
      - name: Attest exact build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/promoted/SHA256SUMS.txt
      - name: Attest exact portable package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/promoted/StickyMD-*-windows-x64-portable.zip
          sbom-path: dist/promoted/SBOM.spdx.json
      - name: Create or update draft only
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.release_tag }}'
          notes="${RUNNER_TEMP}/release-notes.txt"
          printf '%s\n' \
            "Unsigned Windows x64 portable draft for ${tag}." \
            "Verify SHA256SUMS and attestations before separately authorizing publish." \
            > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == "true" ]] || { printf 'Refusing to modify a published release\n' >&2; exit 1; }
            gh release edit "$tag" --draft --title "StickyMD $tag" --notes-file "$notes"
            gh release upload "$tag" --clobber dist/promoted/StickyMD-*-windows-x64-portable.zip dist/promoted/SHA256SUMS.txt dist/promoted/SBOM.spdx.json
          else
            gh release create "$tag" --draft --verify-tag --title "StickyMD $tag" --notes-file "$notes" dist/promoted/StickyMD-*-windows-x64-portable.zip dist/promoted/SHA256SUMS.txt dist/promoted/SBOM.spdx.json
          fi

  publish:
    if: inputs.operation == 'publish'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify original candidate workflow identity
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/${GH_REPO}/actions/runs/${{ inputs.artifact_run_id }}"
          [[ "$(gh api "$endpoint" --jq .head_sha)" == '${{ inputs.source_sha }}' ]] || { printf 'Artifact run/source mismatch\n' >&2; exit 1; }
          [[ "$(gh api "$endpoint" --jq .conclusion)" == 'success' ]] || { printf 'Artifact run is not successful\n' >&2; exit 1; }
          [[ "$(gh api "$endpoint" --jq .name)" == 'release' ]] || { printf 'Artifact run is not the release workflow\n' >&2; exit 1; }
      - name: Download existing draft assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh release view '${{ inputs.release_tag }}' --json isDraft --jq .isDraft)" == "true" ]] || { printf 'Release is not an unpublished draft\n' >&2; exit 1; }
          actual="$(gh api "repos/${GH_REPO}/git/ref/tags/${{ inputs.release_tag }}" --jq .object.sha)"
          [[ "$actual" == '${{ inputs.source_sha }}' ]] || { printf 'Tag/source mismatch\n' >&2; exit 1; }
          mkdir -p dist/promoted
          gh release download '${{ inputs.release_tag }}' --dir dist/promoted
      - name: Verify draft still contains the promoted artifact
        shell: pwsh
        run: >-
          ./tools/release/verify-promoted-artifact.ps1
          -ArtifactDirectory dist/promoted
          -SourceSha '${{ inputs.source_sha }}'
          -ExpectedZipSha256 '${{ inputs.expected_zip_sha256 }}'
          -ExpectedSbomSha256 '${{ inputs.expected_sbom_sha256 }}'
          -ReleaseTag '${{ inputs.release_tag }}'
      - name: Publish existing verified draft
        run: gh release edit '${{ inputs.release_tag }}' --draft=false
