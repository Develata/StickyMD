name: promote-release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact USER-authorized operation
        required: true
        type: choice
        options:
          - tag
          - draft
          - publish
      source_sha:
        description: Full approved Source Freeze commit
        required: true
        type: string
      artifact_run_id:
        description: release workflow run containing the promoted candidate
        required: true
        type: string
      expected_zip_sha256:
        description: Promoted candidate ZIP SHA-256
        required: true
        type: string
      expected_sbom_sha256:
        description: Promoted candidate SBOM SHA-256
        required: true
        type: string
      release_tag:
        description: Approved release tag, for example v0.1.0
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  tag:
    if: inputs.operation == 'tag'
    # The frozen candidate verifier uses Windows PowerShell archive/resource adapters.
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          name: stickymd-windows-x64-release
          path: dist/promoted
      - name: Verify exact artifact identity
        shell: pwsh
        run: >-
          ./tools/release/verify-promoted-artifact.ps1
          -ArtifactDirectory dist/promoted
          -SourceSha '${{ inputs.source_sha }}'
          -ExpectedZipSha256 '${{ inputs.expected_zip_sha256 }}'
          -ExpectedSbomSha256 '${{ inputs.expected_sbom_sha256 }}'
          -ReleaseTag '${{ inputs.release_tag }}'
      - name: Create or verify exact source tag
        shell: pwsh
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          . ./tools/release/github-observation.ps1
          $state = Get-StickyMdRemoteState -RepoRoot (Get-Location).Path -Kind tag -SourceSha $env:APPROVED_SOURCE_SHA -ReleaseTag $env:RELEASE_TAG -AllowMissing
          if (-not $state.exists) {
            gh api --method POST "repos/$env:GH_REPO/git/refs" -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$env:APPROVED_SOURCE_SHA" | Out-Null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  draft:
    if: inputs.operation == 'draft'
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          name: stickymd-windows-x64-release
          path: dist/promoted
      - name: Verify exact artifact identity
        shell: pwsh
        run: >-
          ./tools/release/verify-promoted-artifact.ps1
          -ArtifactDirectory dist/promoted
          -SourceSha '${{ inputs.source_sha }}'
          -ExpectedZipSha256 '${{ inputs.expected_zip_sha256 }}'
          -ExpectedSbomSha256 '${{ inputs.expected_sbom_sha256 }}'
          -ReleaseTag '${{ inputs.release_tag }}'
      - name: Verify tag identity
        shell: pwsh
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          . ./tools/release/github-observation.ps1
          Get-StickyMdRemoteState -RepoRoot (Get-Location).Path -Kind tag -SourceSha $env:APPROVED_SOURCE_SHA -ReleaseTag $env:RELEASE_TAG | Out-Null
      - name: Attest exact build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/promoted/SHA256SUMS.txt
      - name: Attest exact portable package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/promoted/StickyMD-*-windows-x64-portable.zip
          sbom-path: dist/promoted/SBOM.spdx.json
      - name: Create or update draft only
        shell: pwsh
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          . ./tools/release/github-observation.ps1
          $state = Get-StickyMdRemoteState -RepoRoot (Get-Location).Path -Kind draft -SourceSha $env:APPROVED_SOURCE_SHA -ReleaseTag $env:RELEASE_TAG -AllowMissing
          $tag = $env:RELEASE_TAG
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.txt'
          [IO.File]::WriteAllText($notes, "Unsigned Windows x64 portable draft for $tag.`nVerify SHA256SUMS and attestations before separately authorizing publish.`n", [Text.UTF8Encoding]::new($false))
          $assets = @((Get-ChildItem -LiteralPath dist/promoted -Filter 'StickyMD-*-windows-x64-portable.zip').FullName) + @('dist/promoted/SHA256SUMS.txt', 'dist/promoted/SBOM.spdx.json')
          if ($state.exists) {
            gh release edit $tag --draft --title "StickyMD $tag" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag --clobber @assets
          } else {
            gh release create $tag --draft --verify-tag --title "StickyMD $tag" --notes-file $notes @assets
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    if: inputs.operation == 'publish'
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify original candidate workflow identity
        shell: pwsh
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          $observation = & gh api "repos/$env:GH_REPO/actions/runs/$env:ARTIFACT_RUN_ID"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $observation | & cargo run --quiet -p stickymd-smoke --locked -- release verify-workflow "--source-sha=$env:APPROVED_SOURCE_SHA" --workflow-json -
          exit $LASTEXITCODE
      - name: Download existing draft assets
        shell: pwsh
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          . ./tools/release/github-observation.ps1
          Get-StickyMdRemoteState -RepoRoot (Get-Location).Path -Kind draft -SourceSha $env:APPROVED_SOURCE_SHA -ReleaseTag $env:RELEASE_TAG | Out-Null
          Get-StickyMdRemoteState -RepoRoot (Get-Location).Path -Kind tag -SourceSha $env:APPROVED_SOURCE_SHA -ReleaseTag $env:RELEASE_TAG | Out-Null
          New-Item -ItemType Directory -Path dist/promoted -Force | Out-Null
          gh release download $env:RELEASE_TAG --dir dist/promoted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify draft still contains the promoted artifact
        shell: pwsh
        run: >-
          ./tools/release/verify-promoted-artifact.ps1
          -ArtifactDirectory dist/promoted
          -SourceSha '${{ inputs.source_sha }}'
          -ExpectedZipSha256 '${{ inputs.expected_zip_sha256 }}'
          -ExpectedSbomSha256 '${{ inputs.expected_sbom_sha256 }}'
          -ReleaseTag '${{ inputs.release_tag }}'
      - name: Publish existing verified draft
        run: gh release edit '${{ inputs.release_tag }}' --draft=false
