name: promote-release

# TAG, DRAFT and PUBLISH are three separate USER authorizations (plan 11 #release-artifact-authority).
# Every operation re-checks both candidates against the approved Release Attachment Set: one
# Windows and one macOS set, released together, never one platform alone.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact USER-authorized operation
        required: true
        type: choice
        options:
          - tag
          - draft
          - publish
      source_sha:
        description: Full release commit R (the approved Source Freeze)
        required: true
        type: string
      release_tag:
        description: Approved release tag, for example v0.3.0
        required: true
        type: string
      windows_run_id:
        description: release run of the promoted Windows candidate
        required: true
        type: string
      windows_artifact_id:
        description: artifact id of the promoted Windows candidate
        required: true
        type: string
      macos_run_id:
        description: release-macos run of the promoted macOS candidate
        required: true
        type: string
      macos_run_attempt:
        description: the successful attempt of that run
        required: true
        type: string
      macos_artifact_id:
        description: artifact id that attempt produced
        required: true
        type: string
      attachments:
        description: Approved Release Attachment Set, name=sha256 for all six files, comma-separated
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

# One operation per tag at a time: a DRAFT cannot replace attachments while a PUBLISH of the same
# tag checks them, and PUBLISH also compares the draft's release and asset ids before and after.
concurrency:
  group: promote-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  tag:
    if: inputs.operation == 'tag'
    # The frozen Windows candidate verifier uses Windows PowerShell archive/resource adapters.
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Dispatched on main
        # plan 11: TAG is dispatched from main, and R must be on the main line.
        shell: pwsh
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          if ($env:RUN_REF -cne 'refs/heads/main') { throw "TAG must be dispatched on refs/heads/main, not $env:RUN_REF" }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The checkout is the release commit on main
        # Only the runner's Git runs here: nothing from the checked-out commit (actions, scripts,
        # Cargo) runs before R is known to be on the main line.
        shell: pwsh
        env:
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: |
          if ($env:RELEASE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'source_sha must be a full lowercase commit SHA' }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:RELEASE_SHA) { throw "the checkout is $head, not $env:RELEASE_SHA" }
          $env:GIT_NO_REPLACE_OBJECTS = '1'
          $env:GIT_GRAFT_FILE = 'NUL'
          git merge-base --is-ancestor $env:RELEASE_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release commit is not contained in origin/main' }
      - uses: ./.github/actions/verify-release-candidates
        with:
          source_sha: ${{ inputs.source_sha }}
          release_tag: ${{ inputs.release_tag }}
          windows_run_id: ${{ inputs.windows_run_id }}
          windows_artifact_id: ${{ inputs.windows_artifact_id }}
          macos_run_id: ${{ inputs.macos_run_id }}
          macos_run_attempt: ${{ inputs.macos_run_attempt }}
          macos_artifact_id: ${{ inputs.macos_artifact_id }}
          attachments: ${{ inputs.attachments }}
      - name: Create or verify exact source tag
        shell: pwsh
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          . ./tools/release/github-observation.ps1
          $state = Get-StickyMdRemoteState -RepoRoot (Get-Location).Path -Kind tag -SourceSha $env:APPROVED_SOURCE_SHA -ReleaseTag $env:RELEASE_TAG -AllowMissing
          if (-not $state.exists) {
            gh api --method POST "repos/$env:GH_REPO/git/refs" -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$env:APPROVED_SOURCE_SHA" | Out-Null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  draft:
    if: inputs.operation == 'draft'
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Dispatched on the release tag
        # The attestations carry the dispatching run's ref and SHA, so DRAFT runs on the tag.
        shell: pwsh
        env:
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RUN_REF -cne "refs/tags/$env:RELEASE_TAG") { throw "DRAFT must be dispatched on refs/tags/$env:RELEASE_TAG, not $env:RUN_REF" }
          if ($env:RUN_SHA -cne $env:RELEASE_SHA) { throw "the run's SHA $env:RUN_SHA is not the release commit $env:RELEASE_SHA" }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The checkout is the release commit on main
        # Only the runner's Git runs here: nothing from the checked-out commit (actions, scripts,
        # Cargo) runs before R is known to be on the main line.
        shell: pwsh
        env:
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: |
          if ($env:RELEASE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'source_sha must be a full lowercase commit SHA' }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:RELEASE_SHA) { throw "the checkout is $head, not $env:RELEASE_SHA" }
          $env:GIT_NO_REPLACE_OBJECTS = '1'
          $env:GIT_GRAFT_FILE = 'NUL'
          git merge-base --is-ancestor $env:RELEASE_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release commit is not contained in origin/main' }
      - name: Verify tag identity
        shell: pwsh
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          . ./tools/release/github-observation.ps1
          Get-StickyMdRemoteState -RepoRoot (Get-Location).Path -Kind tag -SourceSha $env:APPROVED_SOURCE_SHA -ReleaseTag $env:RELEASE_TAG | Out-Null
      - uses: ./.github/actions/verify-release-candidates
        with:
          source_sha: ${{ inputs.source_sha }}
          release_tag: ${{ inputs.release_tag }}
          windows_run_id: ${{ inputs.windows_run_id }}
          windows_artifact_id: ${{ inputs.windows_artifact_id }}
          macos_run_id: ${{ inputs.macos_run_id }}
          macos_run_attempt: ${{ inputs.macos_run_attempt }}
          macos_artifact_id: ${{ inputs.macos_artifact_id }}
          attachments: ${{ inputs.attachments }}
      - name: Attest Windows build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/promoted/windows/SHA256SUMS.txt
      - name: Attest Windows portable package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/promoted/windows/StickyMD-*-windows-x64-portable.zip
          sbom-path: dist/promoted/windows/SBOM.spdx.json
      - name: Attest macOS build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/promoted/macos/SHA256SUMS-macos-arm64.txt
      - name: Attest macOS portable package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/promoted/macos/StickyMD-*-macos-arm64-portable.zip
          sbom-path: dist/promoted/macos/SBOM-macos-arm64.spdx.json
      - name: An existing draft holds no file outside the approved set
        # A stale asset from an earlier draft is not removed silently; the draft is refused.
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ATTACHMENTS: ${{ inputs.attachments }}
        run: |
          function Get-ReleaseSnapshot {
            param($Release)
            $assets = @($Release.assets | Sort-Object id | ForEach-Object { "$($_.id)|$($_.name)|$($_.size)" })
            [pscustomobject]@{ id = "$($Release.id)"; draft = [bool]$Release.draft; names = @($Release.assets | ForEach-Object { $_.name }); text = "$($Release.id)|$($assets -join ';')" }
          }
          function Get-DraftSnapshot {
            $text = (& gh api --paginate --slurp "repos/$env:GH_REPO/releases?per_page=100") -join "`n"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not $text.Trim()) { throw 'the release listing is empty' }
            $releases = @($text | ConvertFrom-Json | ForEach-Object { $_ })
            foreach ($release in $releases) {
              foreach ($field in 'id', 'tag_name', 'draft', 'assets') { if ($release.PSObject.Properties.Name -cnotcontains $field) { throw "a listed release has no $field" } }
              foreach ($asset in @($release.assets)) {
                foreach ($field in 'id', 'name', 'size') { if ($asset.PSObject.Properties.Name -cnotcontains $field) { throw "an asset of release $($release.id) has no $field" } }
              }
            }
            $matching = @($releases | Where-Object { $_.tag_name -ceq $env:RELEASE_TAG })
            if ($matching.Count -eq 0) { return $null }
            if ($matching.Count -ne 1) { throw "$($matching.Count) releases carry $env:RELEASE_TAG" }
            Get-ReleaseSnapshot $matching[0]
          }
          $draft = Get-DraftSnapshot
          if ($null -ne $draft) {
            if (-not $draft.draft) { throw "the release $env:RELEASE_TAG is already published" }
            $approved = @($env:ATTACHMENTS.Split(',') | ForEach-Object { $_.Trim().Split('=')[0] })
            $stale = @($draft.names | Where-Object { $approved -cnotcontains $_ })
            if ($stale.Count -gt 0) { throw "the draft holds files outside the approved set: $($stale -join ', ')" }
          }
      - name: Create or update draft only
        shell: pwsh
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          MACOS_RUN_ID: ${{ inputs.macos_run_id }}
          MACOS_RUN_ATTEMPT: ${{ inputs.macos_run_attempt }}
        run: |
          . ./tools/release/github-observation.ps1
          $state = Get-StickyMdRemoteState -RepoRoot (Get-Location).Path -Kind draft -SourceSha $env:APPROVED_SOURCE_SHA -ReleaseTag $env:RELEASE_TAG -AllowMissing
          $tag = $env:RELEASE_TAG
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.txt'
          $text = "StickyMD $tag draft: Windows x64 portable (unsigned) and macOS arm64 portable (ad-hoc signed, not notarized).`n" +
            "Windows built from $env:WINDOWS_BUILD_SHA (release run $env:WINDOWS_RUN_ID, latest attempt $env:WINDOWS_RUN_ATTEMPT when checked).`n" +
            "macOS built from $env:MACOS_BUILD_SHA (release-macos run $env:MACOS_RUN_ID, attempt $env:MACOS_RUN_ATTEMPT).`n" +
            "Verify SHA256SUMS.txt, SHA256SUMS-macos-arm64.txt and the attestations before separately authorizing publish.`n"
          [IO.File]::WriteAllText($notes, $text, [Text.UTF8Encoding]::new($false))
          $assets = @(Get-ChildItem -LiteralPath dist/promoted/windows, dist/promoted/macos -File | ForEach-Object { $_.FullName })
          if ($state.exists) {
            gh release edit $tag --draft --title "StickyMD $tag" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag --clobber @assets
          } else {
            gh release create $tag --draft --verify-tag --title "StickyMD $tag" --notes-file $notes @assets
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The draft holds exactly the approved six files
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ATTACHMENTS: ${{ inputs.attachments }}
        run: |
          New-Item -ItemType Directory -Path dist/draft -Force | Out-Null
          gh release download $env:RELEASE_TAG --dir dist/draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --quiet -p stickymd-smoke --locked -- release verify-attachments --directory dist/draft --attachments $env:ATTACHMENTS
          exit $LASTEXITCODE

  publish:
    if: inputs.operation == 'publish'
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Dispatched on the release tag
        # The attestations carry the dispatching run's ref and SHA, so PUBLISH runs on the tag.
        shell: pwsh
        env:
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RUN_REF -cne "refs/tags/$env:RELEASE_TAG") { throw "PUBLISH must be dispatched on refs/tags/$env:RELEASE_TAG, not $env:RUN_REF" }
          if ($env:RUN_SHA -cne $env:RELEASE_SHA) { throw "the run's SHA $env:RUN_SHA is not the release commit $env:RELEASE_SHA" }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The checkout is the release commit on main
        # Only the runner's Git runs here: nothing from the checked-out commit (actions, scripts,
        # Cargo) runs before R is known to be on the main line.
        shell: pwsh
        env:
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: |
          if ($env:RELEASE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'source_sha must be a full lowercase commit SHA' }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:RELEASE_SHA) { throw "the checkout is $head, not $env:RELEASE_SHA" }
          $env:GIT_NO_REPLACE_OBJECTS = '1'
          $env:GIT_GRAFT_FILE = 'NUL'
          git merge-base --is-ancestor $env:RELEASE_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release commit is not contained in origin/main' }
      - uses: ./.github/actions/verify-release-candidates
        with:
          source_sha: ${{ inputs.source_sha }}
          release_tag: ${{ inputs.release_tag }}
          windows_run_id: ${{ inputs.windows_run_id }}
          windows_artifact_id: ${{ inputs.windows_artifact_id }}
          macos_run_id: ${{ inputs.macos_run_id }}
          macos_run_attempt: ${{ inputs.macos_run_attempt }}
          macos_artifact_id: ${{ inputs.macos_artifact_id }}
          attachments: ${{ inputs.attachments }}
      - name: Snapshot the draft before download
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          function Get-ReleaseSnapshot {
            param($Release)
            $assets = @($Release.assets | Sort-Object id | ForEach-Object { "$($_.id)|$($_.name)|$($_.size)" })
            [pscustomobject]@{ id = "$($Release.id)"; draft = [bool]$Release.draft; names = @($Release.assets | ForEach-Object { $_.name }); text = "$($Release.id)|$($assets -join ';')" }
          }
          function Get-DraftSnapshot {
            $text = (& gh api --paginate --slurp "repos/$env:GH_REPO/releases?per_page=100") -join "`n"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not $text.Trim()) { throw 'the release listing is empty' }
            $releases = @($text | ConvertFrom-Json | ForEach-Object { $_ })
            foreach ($release in $releases) {
              foreach ($field in 'id', 'tag_name', 'draft', 'assets') { if ($release.PSObject.Properties.Name -cnotcontains $field) { throw "a listed release has no $field" } }
              foreach ($asset in @($release.assets)) {
                foreach ($field in 'id', 'name', 'size') { if ($asset.PSObject.Properties.Name -cnotcontains $field) { throw "an asset of release $($release.id) has no $field" } }
              }
            }
            $matching = @($releases | Where-Object { $_.tag_name -ceq $env:RELEASE_TAG })
            if ($matching.Count -eq 0) { return $null }
            if ($matching.Count -ne 1) { throw "$($matching.Count) releases carry $env:RELEASE_TAG" }
            Get-ReleaseSnapshot $matching[0]
          }
          $draft = Get-DraftSnapshot
          if ($null -eq $draft -or -not $draft.draft) { throw "no draft release carries $env:RELEASE_TAG" }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'draft-snapshot.txt'), $draft.text)
      - name: Download existing draft assets
        shell: pwsh
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          . ./tools/release/github-observation.ps1
          Get-StickyMdRemoteState -RepoRoot (Get-Location).Path -Kind draft -SourceSha $env:APPROVED_SOURCE_SHA -ReleaseTag $env:RELEASE_TAG | Out-Null
          Get-StickyMdRemoteState -RepoRoot (Get-Location).Path -Kind tag -SourceSha $env:APPROVED_SOURCE_SHA -ReleaseTag $env:RELEASE_TAG | Out-Null
          New-Item -ItemType Directory -Path dist/draft -Force | Out-Null
          gh release download $env:RELEASE_TAG --dir dist/draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The downloaded draft is exactly the approved six files
        shell: pwsh
        env:
          ATTACHMENTS: ${{ inputs.attachments }}
        run: |
          cargo run --quiet -p stickymd-smoke --locked -- release verify-attachments --directory dist/draft --attachments $env:ATTACHMENTS
          exit $LASTEXITCODE
      - name: Publish the verified draft by its release id
        # The draft must be the very release and assets downloaded and checked above. GitHub has
        # no conditional update: the release is read by id just before and just after the PATCH,
        # and a release that is not the checked one fails the job. Nothing is changed back
        # automatically: what to do with a changed release is the USER's decision.
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $before = [IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'draft-snapshot.txt'))
          $id = $before.Split('|')[0]
          if ($id -cnotmatch '^[1-9][0-9]{0,18}$') { throw 'the recorded draft has no release id' }
          function Get-ReleaseById {
            $text = (& gh api "repos/$env:GH_REPO/releases/$id") -join "`n"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not $text.Trim()) { throw "release $id answered with nothing" }
            $release = $text | ConvertFrom-Json
            foreach ($field in 'id', 'tag_name', 'draft', 'assets') { if ($release.PSObject.Properties.Name -cnotcontains $field) { throw "release $id has no $field" } }
            foreach ($asset in @($release.assets)) {
              foreach ($field in 'id', 'name', 'size') { if ($asset.PSObject.Properties.Name -cnotcontains $field) { throw "an asset of release $id has no $field" } }
            }
            if ($release.tag_name -cne $env:RELEASE_TAG) { throw "release $id now carries $($release.tag_name)" }
            $assets = @($release.assets | Sort-Object id | ForEach-Object { "$($_.id)|$($_.name)|$($_.size)" })
            [pscustomobject]@{ draft = [bool]$release.draft; text = "$($release.id)|$($assets -join ';')" }
          }
          $draft = Get-ReleaseById
          if (-not $draft.draft -or $draft.text -cne $before) { throw "the draft of $env:RELEASE_TAG changed after it was checked" }
          gh api --method PATCH "repos/$env:GH_REPO/releases/$id" -F draft=false | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $after = Get-ReleaseById
          if ($after.draft -or $after.text -cne $before) {
            throw "release $id of $env:RELEASE_TAG is not the checked release after publishing; it was left as it is for the USER to decide"
          }
