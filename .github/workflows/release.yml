name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install checksum-verified cargo-deny 0.20.2
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Licenses, advisories, bans, and sources
        run: cargo deny check

  build-package:
    name: Build and verify Windows x64 package
    needs: dependency-policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source version and provenance
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"\s*$').Groups[1].Value
          if (-not $version) { throw 'Workspace version is missing' }
          if ('${{ github.event_name }}' -eq 'push') {
            if ('${{ github.ref_name }}' -ne "v$version") { throw 'Tag does not match workspace version' }
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Tagged commit is not contained in origin/main' }
          }
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --check
      - name: Strict clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Headless phase smoke
        shell: pwsh
        run: ./tools/smoke/all.ps1 -Ci
      - name: Build exact release commit
        run: cargo build --workspace --release --locked
      - name: Verify portable native runtime dependencies
        run: cargo run -p stickymd-smoke --locked -- qualification native-runtime --exe=target/release/stickymd-win.exe
      - name: Package
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            ./tools/release/package.ps1 -ReleaseTag '${{ github.ref_name }}'
          } else {
            ./tools/release/package.ps1
          }
      - name: Generate verified SPDX SBOM and checksums
        shell: pwsh
        run: ./tools/release/generate-sbom.ps1
      - name: Verify package
        shell: pwsh
        run: ./tools/release/verify-package.ps1
      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stickymd-windows-x64-release
          path: |
            dist/StickyMD-*-windows-x64-portable.zip
            dist/SHA256SUMS.txt
            dist/SBOM.spdx.json
          if-no-files-found: error
          retention-days: 14

  attest-and-draft:
    name: Attest and create draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download exact verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stickymd-windows-x64-release
          path: dist
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt
      - name: Attest portable package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/StickyMD-*-windows-x64-portable.zip
          sbom-path: dist/SBOM.spdx.json
      - name: Create draft release only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.txt"
          printf '%s\n' \
            "Unsigned Windows x64 portable draft for ${GITHUB_REF_NAME}." \
            "Review the manual acceptance matrix and verify SHA256SUMS plus attestations before publishing." \
            > "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            existing_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [[ "$existing_draft" != "true" ]]; then
              printf 'Refusing to modify already-published release %s\n' "$GITHUB_REF_NAME" >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --draft --title "StickyMD $GITHUB_REF_NAME" --notes-file "$notes"
            gh release upload "$GITHUB_REF_NAME" --clobber \
              dist/StickyMD-*-windows-x64-portable.zip \
              dist/SHA256SUMS.txt \
              dist/SBOM.spdx.json
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "StickyMD $GITHUB_REF_NAME" \
              --notes-file "$notes" \
              dist/StickyMD-*-windows-x64-portable.zip \
              dist/SHA256SUMS.txt \
              dist/SBOM.spdx.json
          fi
