name: release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Three jobs on separate runners (plan 11 #platform-artifact-reuse). The job that builds the
# release bytes runs only code the Platform Build Input Fingerprint counts; the verification tool
# runs before it (self-check) and on the uploaded artifact after it (verify-artifact). The run
# succeeds only when every job does.
jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install checksum-verified cargo-deny 0.20.2
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Licenses, advisories, bans, and sources
        run: cargo deny check

  self-check:
    name: Self-check Windows x64 sources
    needs: dependency-policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source version and provenance
        shell: pwsh
        run: |
          cargo run --quiet -p stickymd-smoke --locked -- release workspace-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Candidate commit is not contained in origin/main' }
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --check
      - name: Strict clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Headless phase smoke
        shell: pwsh
        run: ./tools/smoke/all.ps1 -Ci

  build-package:
    name: Build and package Windows x64
    needs: self-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate provenance
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Candidate commit is not contained in origin/main' }
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build exact release commit
        run: cargo build --workspace --release --locked
      - name: Verify portable native runtime dependencies
        run: cargo run -p stickymd-package --locked -- native-runtime --exe target/release/stickymd-win.exe
      - name: Package
        shell: pwsh
        run: ./tools/release/package.ps1 -ExactCandidate
      - name: Generate verified SPDX SBOM and checksums
        shell: pwsh
        run: ./tools/release/generate-sbom.ps1
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stickymd-windows-x64-release
          path: |
            dist/StickyMD-*-windows-x64-portable.zip
            dist/SHA256SUMS.txt
            dist/SBOM.spdx.json
          if-no-files-found: error
          retention-days: 90

  verify-artifact:
    name: Verify the uploaded Windows x64 artifact
    needs: build-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Download the uploaded artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: stickymd-windows-x64-release
          path: dist
      - name: Verify package
        shell: pwsh
        run: ./tools/release/verify-package.ps1
