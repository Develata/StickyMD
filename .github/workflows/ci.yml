name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install checksum-verified cargo-deny 0.20.2
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Licenses, advisories, bans, and sources
        run: cargo deny check

  windows-quality:
    name: Windows x64 (format + lint)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows-headless:
    name: Windows x64 headless (${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [tests, performance]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - name: Phase 00-14 headless ${{ matrix.shard }} shard
        run: cargo run -p stickymd-smoke --locked -- all --ci --ci-shard=${{ matrix.shard }} --json

  windows-release:
    name: Windows x64 release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - name: release build
        run: cargo build --workspace --release --locked

  portable-core:
    name: Linux portable-core build (core + render only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      # Purpose: prove platform-independent crates stay Win32-free.
      # This job must never grow to build the Windows app.
      - name: build core + render
        run: cargo build -p stickymd-core -p stickymd-render --locked
      - name: test core + render
        run: cargo test -p stickymd-core -p stickymd-render --locked
