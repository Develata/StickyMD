name: Verify release candidates
description: >-
  Download the Windows and macOS candidates by artifact id, check each artifact belongs to the
  named run (and, for macOS, attempt), and check both sets against the approved Release
  Attachment Set and the release commit (plan 11 #release-attachment-set). Files land in
  dist/promoted/windows and dist/promoted/macos.
inputs:
  source_sha:
    description: Release commit R
    required: true
  release_tag:
    description: Release tag
    required: true
  windows_run_id:
    description: release run of the Windows candidate
    required: true
  windows_artifact_id:
    description: artifact id of the Windows candidate
    required: true
  macos_run_id:
    description: release-macos run of the macOS candidate
    required: true
  macos_run_attempt:
    description: the successful attempt of that run
    required: true
  macos_artifact_id:
    description: artifact id that attempt produced
    required: true
  attachments:
    description: approved name=sha256 list of all six files
    required: true
runs:
  using: composite
  steps:
    - name: Check, download and compare both candidates
      shell: pwsh
      env:
        RELEASE_SHA: ${{ inputs.source_sha }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
        WINDOWS_ARTIFACT_ID: ${{ inputs.windows_artifact_id }}
        MACOS_RUN_ID: ${{ inputs.macos_run_id }}
        MACOS_RUN_ATTEMPT: ${{ inputs.macos_run_attempt }}
        MACOS_ARTIFACT_ID: ${{ inputs.macos_artifact_id }}
        ATTACHMENTS: ${{ inputs.attachments }}
      run: |
        $ErrorActionPreference = 'Stop'
        Set-StrictMode -Version Latest
        function Invoke-Checked { param([scriptblock]$Command) & $Command; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
        function Get-Json { param([string]$Endpoint) $text = & gh api $Endpoint; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $text -join "`n" }
        function Save-Artifact {
          param([string]$Id, [string]$Destination)
          $archive = Join-Path $env:RUNNER_TEMP "artifact-$Id.zip"
          # curl writes the bytes as they are; the API answers with a redirect to the archive.
          & curl.exe -fsSL --proto '=https' -H "Authorization: Bearer $env:GH_TOKEN" -H 'Accept: application/vnd.github+json' `
            -o $archive "https://api.github.com/repos/$env:GH_REPO/actions/artifacts/$Id/zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path $Destination -Force | Out-Null
          & tar -xf $archive -C $Destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        function Assert-Artifact {
          param([string]$Id, [string]$RunId, [string]$Name)
          $artifact = (Get-Json "repos/$env:GH_REPO/actions/artifacts/$Id") | ConvertFrom-Json
          if ("$($artifact.workflow_run.id)" -ne $RunId) { throw "artifact $Id does not belong to run $RunId" }
          if ($artifact.name -ne $Name) { throw "artifact $Id is $($artifact.name), expected $Name" }
          if ($artifact.expired) { throw "artifact $Id has expired" }
        }
        # Windows: the artifact of the run, the run a successful `release`.
        Assert-Artifact $env:WINDOWS_ARTIFACT_ID $env:WINDOWS_RUN_ID 'stickymd-windows-x64-release'
        $windowsRun = Get-Json "repos/$env:GH_REPO/actions/runs/$env:WINDOWS_RUN_ID"
        $windowsHead = ($windowsRun | ConvertFrom-Json).head_sha
        Invoke-Checked { $windowsRun | cargo run --quiet -p stickymd-smoke --locked -- release verify-workflow "--source-sha=$windowsHead" --workflow release --workflow-json - }
        # macOS: the artifact named for the attempt, the attempt a successful `release-macos`.
        Assert-Artifact $env:MACOS_ARTIFACT_ID $env:MACOS_RUN_ID "stickymd-macos-arm64-release-$env:MACOS_RUN_ATTEMPT"
        $macosAttempt = Get-Json "repos/$env:GH_REPO/actions/runs/$env:MACOS_RUN_ID/attempts/$env:MACOS_RUN_ATTEMPT"
        $macosHead = ($macosAttempt | ConvertFrom-Json).head_sha
        Invoke-Checked { $macosAttempt | cargo run --quiet -p stickymd-smoke --locked -- release verify-workflow "--source-sha=$macosHead" --workflow release-macos --attempt $env:MACOS_RUN_ATTEMPT --workflow-json - }
        Save-Artifact $env:WINDOWS_ARTIFACT_ID 'dist/promoted/windows'
        Save-Artifact $env:MACOS_ARTIFACT_ID 'dist/promoted/macos'
        # Both sets against the approved six files, the checksum files, SBOMs, the macOS
        # inventory, and each README's build source against R by the reuse rule.
        $set = & cargo run --quiet -p stickymd-smoke --locked -- release verify-release-set `
          --release-source $env:RELEASE_SHA --release-tag $env:RELEASE_TAG `
          --attachments $env:ATTACHMENTS `
          --windows-directory dist/promoted/windows --macos-directory dist/promoted/macos
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $set = ($set -join "`n") | ConvertFrom-Json
        if ($set.'windows-x64'.build_source -ne $windowsHead) { throw "the Windows package names $($set.'windows-x64'.build_source), its run head is $windowsHead" }
        if ($set.'macos-arm64'.build_source -ne $macosHead) { throw "the macOS package names $($set.'macos-arm64'.build_source), its attempt head is $macosHead" }
        # The Windows package's own checks, with its build source.
        $hash = @{}
        foreach ($item in $env:ATTACHMENTS.Split(',')) { $pair = $item.Trim().Split('='); $hash[$pair[0]] = $pair[1] }
        $zip = (Get-ChildItem -LiteralPath dist/promoted/windows -Filter 'StickyMD-*-windows-x64-portable.zip').Name
        Invoke-Checked { ./tools/release/verify-promoted-artifact.ps1 -ArtifactDirectory dist/promoted/windows `
          -SourceSha $env:RELEASE_SHA -BuildSha $windowsHead `
          -ExpectedZipSha256 $hash[$zip] -ExpectedSbomSha256 $hash['SBOM.spdx.json'] -ReleaseTag $env:RELEASE_TAG }
        "WINDOWS_BUILD_SHA=$windowsHead" >> $env:GITHUB_ENV
        "MACOS_BUILD_SHA=$macosHead" >> $env:GITHUB_ENV
