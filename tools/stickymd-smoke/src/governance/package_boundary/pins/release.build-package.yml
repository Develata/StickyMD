  build-package:
    name: Build and package Windows x64
    needs: self-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate provenance
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Candidate commit is not contained in origin/main' }
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build exact release commit
        run: cargo build --workspace --release --locked
      - name: Verify portable native runtime dependencies
        run: cargo run -p stickymd-package --locked -- native-runtime --exe target/release/stickymd-win.exe
      - name: Package
        shell: pwsh
        run: ./tools/release/package.ps1 -ExactCandidate
      - name: Generate verified SPDX SBOM and checksums
        shell: pwsh
        run: ./tools/release/generate-sbom.ps1
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stickymd-windows-x64-release
          path: |
            dist/StickyMD-*-windows-x64-portable.zip
            dist/SHA256SUMS.txt
            dist/SBOM.spdx.json
          if-no-files-found: error
          retention-days: 90

