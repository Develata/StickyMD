[package]
name = "spike-persistence"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# 独立实验 crate：不属于生产 workspace（删除本目录不影响生产构建）。
[workspace]

[dependencies]
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_IO",
] }
