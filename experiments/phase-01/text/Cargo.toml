[package]
name = "spike-text"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# 独立实验 crate：不属于生产 workspace（删除本目录不影响生产构建）。
[workspace]

[dependencies]
winit = "0.30.13"
softbuffer = "0.4.8"
cosmic-text = "0.19.0"
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }
